name: download
channels:
  - conda-forge
dependencies:
  - python=3.11
  - setuptools<82 # setuptools 82 has no pkg_resources
  - pyyaml
  - requests
  - tqdm
  - pronto
  # cellxgene-census: TileDB-SOMA comes from conda-forge, since the pip wheel has native
  # library (ABI) problems on macOS.
  - tiledbsoma-py
  - libcxx
  - setuptools<81
  - pip
  - git
  - git-lfs
  - pip:
    - torch
    - torch_geometric
    - transformers>=4.36,<4.40  # pinned for omicverse
    - sentence_transformers
    - cellxgene-census
    - omicverse  # optional matcher of bin/util/ontology_mapping.py
    - anndata
    - zarr<3 # omicverse needs an older anndata, which needs zarr < 3
    - scanpy
    - pybiomart  # Ensembl ID mapping
    - pandas
    - numpy
    - scipy
    - boltons
    - cytoolz
    - frozendict
