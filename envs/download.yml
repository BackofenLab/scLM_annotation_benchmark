name: download
channels:
  - conda-forge
dependencies:
  - python=3.11.18
  - setuptools=80.10.2 # setuptools 82 has no pkg_resources
  - pyyaml=6.0.3
  - requests=2.34.2
  - tqdm=4.70.1
  - pronto=2.7.4
  # cellxgene-census: TileDB-SOMA comes from conda-forge, since the pip wheel has native
  # library (ABI) problems on macOS. conda installs numpy, pandas, scipy and scanpy with it.
  - tiledbsoma-py=2.3.0
  - libcxx=23.1.6
  - numpy=2.4.6
  - pandas=2.3.3
  - scipy=1.17.1
  - scanpy=1.11.5
  - pip=26.2.2
  - git=2.56.1
  - git-lfs=3.8.1
  - pip:
    - torch==2.15.0
    - torch_geometric==2.8.1
    - transformers==4.39.3  # omicverse needs a version below 4.40
    - sentence_transformers==3.1.1
    - cellxgene-census==1.18.0
    - omicverse==2.4.3  # optional matcher of bin/util/ontology_mapping.py
    # The methods' environments (anndata 0.10 and 0.11) cannot read the None values that
    # anndata 0.12 writes into the test sets.
    - anndata==0.11.4
    - zarr==2.18.7 # omicverse needs an older anndata, which needs zarr < 3
    - pybiomart==0.2.0  # Ensembl ID mapping
    - boltons==26.2.0
    - cytoolz==1.2.0
    - frozendict==2.5.1
