name: download
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pyyaml
  - requests
  - tqdm
  - pronto
  # Census dependency stack:
  # Install TileDB-SOMA from conda-forge on macOS to avoid pip wheel/native-lib ABI issues.
  - tiledbsoma-py
  - libcxx
  - pip
  - git
  - git-lfs
  - pip:
    - torch
    - torch_geometric
    - transformers>=4.36,<4.40  # pin for omicverse/scMulan compatibility
    - sentence_transformers
    - cellxgene-census
    - omicverse
    - anndata
    - zarr<3 #omicverse needs an older anndata which needs an older zarr.
    - scanpy  # for preprocessing
    - pybiomart  # for Ensembl ID mapping
    - pandas  # for data manipulation
    - numpy  # for numerical operations
    - scipy  # for statistical functions (median_abs_deviation)
    #- memory_profiler
