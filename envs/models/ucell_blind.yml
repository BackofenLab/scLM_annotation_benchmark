name: ucell
# Versions pinned to a portable set (build strings / system libs left to conda).
channels:
  - conda-forge
dependencies:
  - python=3.11
  - scanpy=1.10.3
  - anndata=0.10.9
  - numpy=1.26.4
  - pandas=2.2.3
  - openpyxl=3.1.5   # read the ScTypeDB .xlsx marker workbook
  - pyyaml=6.0.2     # (run.sh is python-free, but kept for parity/utility)
  - curl=8.*         # prepare.sh downloads ScTypeDB
