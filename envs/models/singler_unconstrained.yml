name: singler
# Bioconductor 3.20 with R 4.4. celldex references are downloaded with ExperimentHub on first use
# and cached in the pipeline's cache directory (see predict.R). bioconductor-singler has no build
# for Apple silicon, so there the pipeline uses singler_unconstrained.osx-64.txt, the Intel
# packages of this recipe.
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.4.3
  # Build 0 of the installer of Bioconductor's data packages: later builds look for a Linux file
  # name on macOS, and the install of GenomeInfoDbData fails there.
  - bioconductor-data-packages=20260207=hdfd78af_0
  - r-optparse=1.7.5
  - r-yaml=2.3.12
  - bioconductor-singlecellexperiment=1.28.0
  - bioconductor-zellkonverter=1.16.0
  - bioconductor-rhdf5=2.50.0        # readH5AD(reader = "R") reads .h5ad files without Python
  - bioconductor-hdf5array=1.34.0
  - bioconductor-singler=2.8.0
  - bioconductor-celldex=1.16.0
  - bioconductor-experimenthub=2.14.0
