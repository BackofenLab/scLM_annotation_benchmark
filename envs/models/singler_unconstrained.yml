name: singler
# Bioconductor 3.20 with R 4.4, installable on linux-64. celldex references are downloaded with
# ExperimentHub on first use and cached in the pipeline's cache directory (see predict.R).
# bioconductor-singler 2.8.0 has no osx-arm64 build, and on macOS the install of GenomeInfoDbData
# fails (see the README); use linux-64 (e.g. -profile helix) or a container.
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.4.*
  - r-optparse=1.7.*
  - r-yaml=2.3.*
  - bioconductor-singlecellexperiment=1.28.0
  - bioconductor-zellkonverter=1.16.0
  - bioconductor-rhdf5=2.50.0        # readH5AD(reader = "R") reads .h5ad files without Python
  - bioconductor-hdf5array=1.34.0
  - bioconductor-singler=2.8.0
  - bioconductor-celldex=1.16.0
  - bioconductor-experimenthub=2.14.0
