name: singler
# R env pinned to Bioconductor 3.20 / R 4.4 (installable on linux-64 and osx-arm64).
# celldex references are fetched via ExperimentHub on first use and cached under the pipeline
# cache dir (see predict.R); zellkonverter reads the .h5ad via a basilisk-managed python env.
# NOTE: bioconductor-singler's osx-arm64 coverage is thin — build/run this on the linux cluster
# (-profile helix) if the Mac cannot solve the env.
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.4.*
  - r-optparse=1.7.*
  - r-yaml=2.3.*
  - bioconductor-singlecellexperiment=1.28.0
  - bioconductor-zellkonverter=1.16.0
  - bioconductor-rhdf5=2.50.0        # reader="R" reads the h5ad in pure R (no basilisk/python)
  - bioconductor-hdf5array=1.34.0
  - bioconductor-singler=2.8.0
  - bioconductor-celldex=1.16.0
  - bioconductor-experimenthub=2.14.0
