name: scsa
# All packages come from conda-forge, which has binary builds of llvmlite, numba, scikit-misc and
# louvain for every platform. With pip, scanpy's dependency llvmlite is built from source, which
# fails under osx-64 (Rosetta). SCSA itself is cloned by prepare.sh.
channels:
  - conda-forge
dependencies:
  - python=3.10.22
  - setuptools=80.10.2
  - pip=26.2.1
  - pyyaml=6.0.3
  - numpy=1.26.4
  - pandas=1.5.3
  - zarr=2.18.3
  - anndata=0.11.4
  - louvain=0.8.2
  - scikit-misc=0.5.2
  - scanpy=1.11.5
