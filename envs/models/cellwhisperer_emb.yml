name: cellwhisperer
channels:
  - conda-forge
dependencies:
  - python=3.10
  - anndata=0.10.2
  - transformers=4.34.1
  - pytorch=2.1.0
  - lightning=2.1.0
  - datasets=2.12.0
  - seaborn
  - scikit-learn
  - scanpy
  - wandb
  - zarr
  - pip:
    - scib
    - pybiomart
    - -e ../../models/cellwhisperer_emb/src/CellWhisperer
    - -e ../../models/cellwhisperer_emb/src/CellWhisperer/modules/Geneformer
