name: sctype
# Bioconductor 3.20 with R 4.4, the oldest release with builds of all packages for linux-64 and
# osx-arm64 (Bioconductor 3.18 with R 4.3 has no osx-arm64 builds of scran and scater). Build
# strings and system libraries are left to conda.
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.4.*
  - r-optparse=1.7.*
  - r-yaml=2.3.*
  - r-igraph=2.*
  - r-dplyr=1.1.*
  - r-openxlsx=4.2.*
  - r-hgnchelper=0.8.*
  - bioconductor-singlecellexperiment=1.28.0
  - bioconductor-zellkonverter=1.16.0
  - bioconductor-rhdf5=2.50.0        # readH5AD(reader = "R") reads .h5ad files without Python
  - bioconductor-hdf5array=1.34.0
  - bioconductor-scran=1.34.0
  - bioconductor-scater=1.34.1
  - curl=8.*            # prepare.sh downloads scType assets
