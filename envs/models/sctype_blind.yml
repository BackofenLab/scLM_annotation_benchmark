name: sctype
# First R env in the repo. Pinned to Bioconductor 3.20 / R 4.4 — the oldest release with a
# consistent set of builds available on BOTH linux-64 (cluster) and osx-arm64 (Bioc 3.18/R4.3
# lacks arm64 scran/scater builds). Build strings / system libs are left to conda to resolve.
# NOTE: zellkonverter reads the .h5ad via a basilisk-managed python env, created & cached on
# first use (needs network once).
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.4.*
  - r-optparse=1.7.*
  - r-yaml=2.3.*
  - r-igraph=2.*
  - r-dplyr=1.1.*
  - r-openxlsx=4.2.*
  - r-hgnchelper=0.8.*
  - bioconductor-singlecellexperiment=1.28.0
  - bioconductor-zellkonverter=1.16.0
  - bioconductor-rhdf5=2.50.0        # reader="R" reads the h5ad in pure R (no basilisk/python)
  - bioconductor-hdf5array=1.34.0
  - bioconductor-scran=1.34.0
  - bioconductor-scater=1.34.1
  - curl=8.*            # prepare.sh downloads scType assets
