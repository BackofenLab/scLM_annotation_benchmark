name: mmcontext
channels:
  - conda-forge
dependencies:
  - python=3.11
  - git
  - git-lfs
  - pip:
    - pyyaml
    # mmcontext is pinned (2026-10-06) to its last commit before the benchmark runs of May 2026;
    # its main was rewritten from 2026-05-27 on and no longer installs. That commit requires
    # adata_hf_datasets from git without a ref, so that line must stay unpinned too (its main has
    # been 17c1830 since 2026-03-23).
    - git+https://github.com/mengerj/adata_hf_datasets.git
    - git+https://github.com/mengerj/mmcontext.git@17d5e7f8c837a3a96012fe8e34c95b8d190089bc
