name: celltypist-env
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.17
  - pip=26.2.1
  - scanpy=1.11.5        # from conda, which avoids a long pip resolution
  - anndata=0.12.19
  - pandas=2.3.3
  - scikit-learn=1.9.1
  - pyyaml=6.0.3               # run.sh parses YAML
  - tqdm=4.70.1
  - zarr=2.18.7
  - numcodecs=0.15.1
  - umap-learn=0.5.12
  - requests=2.34.2
  - git=2.56.0
  - numba==0.60.0
  - pip:
    - celltypist==1.7.1
