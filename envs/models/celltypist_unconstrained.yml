name: celltypist-env
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - scanpy=1.11.*        # from conda, which avoids a long pip resolution
  - anndata>=0.9
  - pandas
  - scikit-learn
  - pyyaml               # run.sh parses YAML
  - tqdm
  - zarr<3
  - numcodecs
  - umap-learn
  - requests
  - git
  - numba==0.60.0
  - pip:
    - celltypist
