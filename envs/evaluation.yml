name: evaluate
channels:
  - conda-forge
dependencies:
  - python=3.11
  - setuptools<82
  - anndata
  - pandas
  - zarr<3
  - pyyaml
  - scikit-learn
  - matplotlib
  - seaborn
  - pronto
  - networkx
  - setuptools<81
  - pip
  - pip:
    - torch
    - transformers>=4.36,<4.40
    - sentence_transformers
    - numpy<2.0   # the osx-64 torch wheel is built against NumPy 1; with NumPy 2, importing
                  # torch for the text-embedding metric fails ("_ARRAY_API not found") and
                  # score_predictions crashes.
# The evaluation does not need omicverse or torch_geometric, whose compiled dependencies fail to
# build under osx-64 (Rosetta).
