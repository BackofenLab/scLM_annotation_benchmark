# Clustering of cells and their marker genes (bin/cluster_cells.py), with the versions of the
# per-cluster analysis of the paper. harmonypy and torch (CPU build) serve the optional Harmony
# integration.
name: clustering
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - scanpy==1.11.5
      - anndata==0.11.4
      - pandas==2.3.3
      - numpy==2.4.5
      - igraph==1.0.0
      - leidenalg==0.12.0
      - harmonypy==0.2.0
      - torch==2.13.0
