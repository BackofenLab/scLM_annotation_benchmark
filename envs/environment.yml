name: sc_lfm

channels:
  - conda-forge
  - bioconda

dependencies:
  # ---- Core ----
  - python=3.11.14
  - pip=25.3
  - setuptools>=65.0.0

  # ---- Core utilities ----
  - pyyaml=6.0.3
  - requests=2.32.5
  - tqdm=4.67.1
  - pronto=2.7.3
  - numba=0.63.1

  # ---- Census / storage stack ----
  - tiledbsoma-py=1.17.0
  - libcxx=21.1.8

  # ---- VCS ----
  - git=2.52.0
  - git-lfs=3.7.1
  # ---- Scientific base ----
  - numpy=1.26.4
  - scipy=1.11.4
  - pandas=2.3.3
  - anndata=0.11.4
  - zarr=2.18.7
  - scikit-learn=1.8.0
  - scanpy=1.9.8
  - numcodecs=0.15.1
  - umap-learn=0.5.11
  - celltypist=1.7.1
  - pytorch=2.7.1
  - torch-geometric=2.6.1
  - transformers=4.46.3
  - sentencepiece-python=0.2.0
  - accelerate=1.12.0
  - sentence-transformers=2.0.0
  - lightning=2.6.0
  - datasets=4.0.0
  - wandb=0.23.1
  - cellxgene-census=1.17.0

  # ---- Plotting ----
  - matplotlib=3.6.3
  - seaborn=0.13.2

# ---- Parallel / distributed compute ----
# Pinned to a recent tested pair compatible with numpy=1.26 and pandas=2.3
  - dask=2024.3.0
  - distributed=2024.3.0
