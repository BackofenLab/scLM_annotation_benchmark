# Model configuration for DeepSeekR1
# You can override any of these at runtime by setting env MODEL_CFG=/path/to/other.yml

deepseek:
  # Reproducibility
  seed: 42

  # OpenRouter model id (or change to another DeepSeek variant you’re allowed to call)
  model_name: "deepseek/deepseek-r1-0528:free"

  # Prompting/task metadata
  task_name: "cell_type_prediction"

  # How the input to the model is constructed
  # Available fields in the template:
  #   {cell_sentence}  → the gene list sentence
  #   {num_genes}      → integer as string (top_k_genes)
  input_prompt_template: |
    You are an expert at classifying cell types based on gene expression.
    Given below is a list of {num_genes} gene names ordered by descending expression level in a single cell.
    Your task is to identify the exact cell type this gene profile represents.
    Cell sentence: {cell_sentence}
    Important rules:
    1. Respond with only the name of the predicted cell type.
    2. Do not include explanations, reasoning, or extra words.
    3. Do not repeat the question or input.
    Output:

  # The expected answer format (used for evaluation ground-truth scaffolding)
  # Available field:
  #   {true_labels}
  answer_template: "{true_labels}"

  # Data shaping
  top_k_genes: 200          # number of genes to include in the cell sentence

  # Workload sizing / rate limiting
  max_samples: 5          # 0 or null → use all cells (this controls the number of cells for which cell type predictions are made starting from the first cell in the csdata object)
  max_workers: 3            # max in-flight requests
  delay_between_requests: 1.2   # seconds between requests (per worker)
