# Model configuration for OpenRouter LLMs
# You can override any of these at runtime by setting env MODEL_CFG=/path/to/other.yml

openrouter_LLM:
  # Reproducibility
  seed: 1234

  # OpenRouter model ids — list of models to run (results saved separately per model)
  # e.g. "openai/gpt-5-chat" for GPT-5, "deepseek/deepseek-r1-0528" for DeepSeekR1
  model_names:
    - meta-llama/llama-4-maverick #(non-reasoning)
    - anthropic/claude-sonnet-4.6 #(reasoning: max_tokens)
    - deepseek/deepseek-v3.2 #(reasoning: effort)
  #  - deepseek/deepseek-v4-pro #(reasoning: effort)
  #  - deepseek/deepseek-v4-flash #(reasoning: effort)
  #  - z-ai/glm-5 #(reasoning: effort)
    - moonshotai/kimi-k2.6 #(reasoning: effort)
    - openai/gpt-5.5 #(reasoning: effort)                              !
    - openai/gpt-oss-20b #(reasoning: effort)
    - openai/gpt-oss-120b #(reasoning: effort)
  #  - google/gemma-4-31b-it #(reasoning: max_tokens)
  #  - google/gemini-3-flash-preview #(reasoning: max_tokens)
    - google/gemini-3.1-pro-preview #(reasoning: max_tokens)
    - anthropic/claude-opus-4.7 #(expensive!, reasoning: max_tokens)
  ## - openai/gpt-5.5-pro #(expensive!, reasoning: effort)

  ##  - deepseek/deepseek-r1-0528 #(optional, always reasoning)
  ##  - mistralai/mistral-large-2512 #(optional, non-reasoning)

  ##  - meta-llama/llama-3.1-8b-instruct #(drop, non-reasoning)
    - meta-llama/llama-3.1-70b-instruct #(drop, non-reasoning)
    - meta-llama/llama-3.3-70b-instruct #(drop, non-reasoning)



  # Prompting/task metadata
  task_name: "cell_type_prediction"

  # How the input to the model is constructed
  # Available fields in the template:
  #   {cell_sentence}  → the gene list sentence
  #   {num_genes}      → integer as string (top_k_genes)
  input_prompt_template: |
    You are an expert at classifying cell types based on gene expression.
    Given below is a list of up to {num_genes} gene names ordered by descending expression level in a single cell.
    Your task is to identify the exact cell type this gene profile represents.
    Cell sentence: {cell_sentence}
    Important rules:
    1. Respond with only the cell type label of the predicted cell type.
    2. Use the canonical cell type label from the OBO Foundry Cell Ontology (CL) — the primary label string as it appears in CL, not a synonym, abbreviation, or free-form description.
    3. Do not include explanations, reasoning, or extra words in the output.
    4. Do not repeat the question or input in the output.
    Output:


  # The expected answer format (used for evaluation ground-truth scaffolding)
  # Available field:
  #   {true_labels}
  answer_template: "{true_labels}"


  # Data shaping
  top_k_genes: 200

  # Workload sizing
  max_samples: null            # 0 or null → use all cells
  max_workers: 10              # concurrent requests per model (adaptive backoff handles rate limits)

  # -------------------- Advanced OpenRouter options --------------------
  provider:
    order: []        # preferred providers (set to [] for :free models!), left-to-right (e.g. ["deepinfra", "openai"] for DeepSeekR1 and GPT-5)
    only: []                    # whitelist (empty = no whitelist)
    ignore: []                  # blacklist
    allow_fallbacks: true       # whether to allow provider fallbacks
    require_parameters: null    # true/false/null
    data_collection: "allow"    # "allow" | "deny" | null
    sort: "price"               # "price" | "throughput" | "latency" | null
    quantizations: []           # e.g. ["fp8","int8"]
    max_price:
      prompt: null              # USD per 1M prompt tokens (float) or null
      completion: null          # USD per 1M completion tokens (float) or null

  generation:
    max_tokens: null
    temperature: null
    top_p: null
    top_k: null
    frequency_penalty: null
    presence_penalty: null
    repetition_penalty: null
    stop: []                    # e.g. ["\n", "Output:"]
    stream: false
    response_format: null       # e.g. {"type": "json_object"}

    reasoning:
      enabled: true             # explicitly enable reasoning for all supporting models
      effort: "medium"          # for OpenAI/xAI models: "minimal"|"low"|"medium"|"high"|"xhigh"|"none"
      max_tokens: 10000         # for Anthropic/Gemini models: explicit budget (1024–128000)
      exclude: false            # true = still reasons but hides tokens from response
      # Both can be set: predict.py picks effort vs max_tokens per model provider

    http_referer: null
    x_title: null
    prepend_reasoning: false
