# datasets/tabula_sapiens_ear.yml
name: tabula_sapiens_ear          # used in channel / filenames
url: https://figshare.com/ndownloader/files/50850693/Ear_TSP1_30_version2d_10X_smartseq_scvi_Nov122024
format: h5ad
subset_size: 20000                # null → use full dataset
batch_key: donor
annotation_key: cell_ontology_class
apply_ontology_mapping: true

preprocessing:
  count_layer_key: "decontXcounts"
# Optional metadata for InstructCell - can use either:
#   Option 1: Direct values (applied to all cells in dataset)
#     species: "human"                    # direct value for all cells
#     tissue: "tissue_name"               # direct value for all cells
#     sequencing_method: "10xGenomics"    # direct value for all cells
#   Option 2: Keys (per-cell values from adata.obs columns)
#     species_key: "species"              # column name for species metadata (per-cell)
#     tissue_key: "tissue"                 # column name for tissue metadata (per-cell)
#     sequencing_method_key: "sequencing_method"  # column name for sequencing method (per-cell)
# species_key: "species"          # column name for species metadata
# tissue_key: "tissue"            # column name for tissue metadata
# sequencing_method_key: "sequencing_method"  # column name for sequencing method metadata
