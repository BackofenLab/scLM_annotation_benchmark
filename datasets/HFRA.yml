# datasets/HFRA.yml
# HFRA was uploaded to cellxgene earliest in December 2025.
name: HFRA       # used in channel / filenames
source: cellxgene_census
census_dataset_id: "aecc2743-4ff2-4b55-ac8c-a1ff76fc4bb4"
census_version: "2025-11-08" # logs a stable build tag for reproducibility (snapshot of census version)
batch_key: "donor_id"
species: "human"
tissue: "retina (fetal)"
annotation_key: "cell_type"
apply_ontology_mapping: false # no ontology mapping required for HFRA (cellxgene already has ontology terms)
celltypist_model: "Fetal_Human_Retina.pkl"
sctype_tissue: "Eye"                              # ScTypeDB tissue for sctype_blind / ucell_blind
scsa_tissue: "Retina"                             # exact CellMarker DB tissue for scsa_blind ("All" = whole DB)
# SingleR reference: an independent developing-human-retina atlas from CELLxGENE Census (Zuo et al.
# 2024). celldex has no retina reference, so HumanPrimaryCellAtlasData scored ~0.00 here. Fetched +
# normalized by bin/prepare_singler_reference.py; labels = its cell_type column (CL-backed).
singler_reference_source: "cellxgene"
singler_reference_id: "963a08cb-d995-4862-9614-f9d38a7d7540"   # Zuo 2024 developing human retina
singler_reference_version: "2025-11-08"                        # pin Census version for reproducibility
singler_reference_label_key: "cell_type"
