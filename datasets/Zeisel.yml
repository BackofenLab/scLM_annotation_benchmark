# Mouse nervous system (Zeisel et al. 2018), the authors' file l5_all_rev1.loom converted to h5ad.

name: Zeisel
url: https://zenodo.org/api/records/24590958/files/Zeisel_l5_all_rev1.h5ad/content

# Cells and labels
annotation_key: "TaxonomyRank4"   # the file holds the taxonomy ranks 1 to 4
batch_key: "DonorID"
apply_ontology_mapping: true      # map the labels to Cell Ontology terms with the mapping table

# Biological context given to methods that use it
organism: "Mus musculus"
species: "mouse"
# The tissue column of the file holds region codes, so the tissue is given here.
tissue: "nervous system (whole mouse CNS and PNS: cortex, hippocampus, cerebellum, midbrain, brainstem, spinal cord, and peripheral sensory/sympathetic/enteric ganglia)"

# Quality control and preprocessing (bin/preprocess.py); the values are the defaults
preprocessing:
  nmads_main: 5                   # median absolute deviations for outliers in counts and genes
  nmads_mt: 3                     # median absolute deviations for outliers in mitochondrial share
  pct_counts_mt_threshold: 8.0    # cells above this mitochondrial percentage are removed
  percent_top: [20]
  min_cells: 10                   # genes detected in fewer cells are removed
  min_genes: 200                  # cells with fewer detected genes are removed

# Inputs of single methods
celltypist_model: "Mouse_Isocortex_Hippocampus.pkl"   # its labels map to Cell Ontology terms
sctype_tissue: "Brain"            # tissue in the ScType database
scsa_tissue: "Brain"              # tissue in the CellMarker database of SCSA
# SingleR reference: a mouse motor cortex atlas from CELLxGENE Census (Yao et al. 2021). It covers
# no peripheral cell types.
singler_reference_source: "cellxgene"
singler_reference_id: "35081d47-99bf-4507-9541-735428df9a9f"
singler_reference_version: "2025-11-08"
singler_reference_label_key: "cell_type"
