# datasets/HIHA.yml
# HIHA was uploaded to cellxgene earliest in December 2025.
name: HIHA       # used in channel / filenames
source: cellxgene_census
census_dataset_id: "e522d2cd-7927-4e59-a4ed-064009569279"
census_version: "2025-11-08" # logs a stable build tag for reproducibility (snapshot of census version)
batch_key: "batch_id"
species: "human"
tissue: "blood (peripheral blood immune cells)"
annotation_key: "cell_type" # different annotation levels by the authors are stil available: ["AIFI_L1", "AIFI_L2", "AIFI_L3"]
apply_ontology_mapping: false # no ontology mapping required for HFRA (cellxgene already has ontology terms)
celltypist_model: "Immune_All_High.pkl"
sctype_tissue: "Immune system"                    # ScTypeDB tissue for sctype_blind / ucell_blind
scsa_tissue: "Peripheral blood"                   # exact CellMarker DB tissue for scsa_blind ("All" = whole DB)
singler_reference_source: "celldex"               # "celldex" = built-in (by name); "cellxgene" = fetched ref h5ad
singler_reference: "MonacoImmuneData"             # celldex immune reference (good fit)
singler_reference_tier: "ont"                     # label.ont = Cell Ontology IDs, the best-scoring HIHA tier (0.177)
