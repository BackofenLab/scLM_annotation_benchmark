# Standalone environment for the context ablation study.
#
# Independent of envs/models/*.yml on purpose: those are unpinned, so the version that resolves
# depends on when they were built. This study measures modest effects, and `cell2sentence` in
# particular DEFINES the cell-sentence construction -- an unpinned upgrade would silently change
# every prompt and be indistinguishable from an experimental effect.
#
# STATUS: considered starting spec, NOT yet a lock file. The pins below are deliberate (see the
# notes per package), but nothing here has been installed and smoke-tested on this machine.
# After the first successful creation and the sentence-equivalence check, regenerate as a true
# lock and commit that:
#
#     conda env create -f env.yml
#     conda activate sc_lfm_context_ablation
#     conda env export --no-builds > env.lock.yml
#
# SPLIT INTO TWO FILES. This one is the CORE stack: everything needed to build prompts, cluster,
# call the OpenRouter arms and score. It carries no torch and no model weights, so it installs in
# ~2 GB and runs on a laptop with little free disk.
#
# The local arms (A2 base Gemma, A3 C2S-Scale) additionally need torch + transformers; those pins
# live in env-local.yml, which includes this file's contents. Run them wherever there is disk and a
# GPU.
#
# `cell2sentence` is pinned IDENTICALLY in both, and that pin is the one that matters most: it
# defines the sentence construction, so a version skew between the two machines would make the arms
# silently incomparable. Prompts are also materialised once (see `execution` in config.yml) so the
# two stacks cannot diverge even if the pins were wrong.
name: sc_lfm_context_ablation
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # --- data + selection -------------------------------------------------
      # Pinned to the versions of the `evaluate` env, which is the stack that actually produced
      # the HVG artifacts in cache/hvg/ -- evidence rather than "latest on PyPI". The first attempt
      # pinned anndata==0.13.2 and numpy==2.2.6 from PyPI's latest, and pip refused: anndata 0.13.x
      # requires Python >= 3.12 while this env is 3.11. scanpy stays at 1.11.5 specifically because
      # highly_variable_genes behaviour can shift between minor versions and the study must run
      # against the implementation that selected its genes.
      - scanpy==1.11.5
      - scikit-misc==0.5.2          # loess backend for the seurat_v3* flavours; verified present
      - anndata==0.11.4
      - pandas==2.3.3
      - numpy==2.4.5

      # --- cell sentences ---------------------------------------------------
      # The single most important pin in this file: it decides what the models actually read.
      - cell2sentence==1.2.0

      # datasets/huggingface-hub are needed by cell2sentence's arrow backend even without torch.
      - datasets==5.0.1
      - huggingface-hub==1.27.0

      # --- clustering arm (A4) ---------------------------------------------
      - leidenalg==0.12.0
      - igraph==1.0.0

      # --- scoring (bin/evaluate.py) ---------------------------------------
      # evaluate.py parses the Cell Ontology with pronto. Without it score.py fails at the point
      # where the run is already paid for, so the study env carries it rather than depending on a
      # separate interpreter. Version taken from the `evaluate` env that produced the main table.
      - pronto==2.7.3

      # --- plumbing ---------------------------------------------------------
      - pyyaml==6.0.3
      - requests==2.34.2
