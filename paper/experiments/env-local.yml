# Environment for the local arms (run_local.py): the packages of env.yml and the torch stack.
#     conda env create -f env-local.yml
# env-local.lock.yml is an export of this environment (conda env export --no-builds).
name: sc_lfm_context_ablation_local
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # As in env.yml.
      - scanpy==1.11.5
      - scikit-misc==0.5.2
      - anndata==0.11.4
      - pandas==2.3.3
      - numpy==2.4.5
      - cell2sentence==1.2.0
      - datasets==5.0.1
      # Lower than in env.yml: transformers 4.57.6 requires huggingface-hub<1.0.
      - huggingface-hub==0.36.2
      - pyyaml==6.0.3
      - requests==2.34.2

      # Torch stack.
      - transformers==4.57.6        # the last 4.x line
      - torch==2.13.0
      - accelerate==1.14.0
      - sentencepiece==0.2.2
      - protobuf==5.29.6
