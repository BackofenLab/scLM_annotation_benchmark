# Environment for the HVG pools, the prompts, the clustering, the OpenRouter arms and
# aggregate.py; without torch. env-local.yml adds the torch stack for the local arms.
#     conda env create -f env.yml
#
# cell2sentence builds the cell sentences, so it has the same pin in both environments.
name: sc_lfm_context_ablation
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Data and gene selection. highly_variable_genes can change between scanpy versions.
      - scanpy==1.11.5
      - scikit-misc==0.5.2          # loess backend for the seurat_v3* flavours
      - anndata==0.11.4
      - pandas==2.3.3
      - numpy==2.4.5

      # Cell sentences.
      - cell2sentence==1.2.0

      # datasets/huggingface-hub are needed by cell2sentence's arrow backend even without torch.
      - datasets==5.0.1
      - huggingface-hub==1.27.0

      # Clustering of the cluster arms.
      - leidenalg==0.12.0
      - igraph==1.0.0

      # The Cell Ontology parser of the scoring scripts in bin/.
      - pronto==2.7.3

      - pyyaml==6.0.3
      - requests==2.34.2
