# Context ablation study — single source of truth for the experimental design.
#
# Independent of main.nf. Consumes cached artifacts from ../cache and reuses ../bin for scoring,
# so the numbers land on the same scale as the main benchmark table.

datasets: [HFRA, HIHA, Zeisel, human_pancreas]

# Eval cells. The SAME 1,000-cell stratified subsets the benchmark scores, so every number here is
# directly comparable to the main table.
eval:
  subset_dir: ../../cache/datasets/subset
  size: 1000
  strategy: stratified

# Repeats. The seed MUST differ per repeat: models/openrouter_LLM_blind/src/predict.py injects the
# seed into the request payload, so repeats at a fixed seed can return identical completions from
# providers that honour it, and would measure nothing. Verified in code, not assumed.
repeats:
  n: 3
  seeds: [1234, 5678, 9012]
  temperature: null        # null = provider default; recorded in the output for the caption

# Provider routing for the OpenRouter arms. The benchmark's own config leaves this open
# (`sort: price`, `allow_fallbacks: true`, empty `only`), so requests go to whichever provider is
# cheapest at that moment and different providers serve different quantizations of the same model.
# That is tolerable for the benchmark's large effects but not for an ablation measuring what a
# tissue string buys, where a silent quantization change mid-run would be indistinguishable from
# the effect. Pin it, and record the provider actually used per request.
provider:
  # PINNED to DeepInfra. Checked against the live endpoint list (20 providers serve gpt-oss-120b,
  # 12 serve gpt-oss-20b, spanning fp4 / fp8 / bf16 / fp16 and a 12x price range), and against what
  # the benchmark actually used, from by_model_provider.csv:
  #
  #   gpt-oss-120b   DekaLLM   3,971 of 3,997 requests (99%)   <- NO LONGER SERVED on OpenRouter
  #   gpt-oss-20b    DeepInfra 3,409 of 3,997 requests (85%)   <- still available, bf16
  #
  # DeepInfra is chosen because it is bf16, the least lossy quantization on offer, and because it
  # is the provider that produced the benchmark's own 20B numbers. This study measures modest
  # effects, so an fp4 endpoint (cheaper, and what price-sorted routing would pick) risks a
  # quantization artifact being read as a context effect.
  #
  # CONSEQUENCE TO CARRY INTO THE TEXT: the provider behind the published 120B number is gone, so
  # the anchor check (A1 at M2 reproducing 0.554) cannot be an exact reproduction. Treat it as
  # "consistent within provider variation", not as a bit-for-bit check, and widen the tolerance
  # accordingly in aggregate.py.
  #
  # It also roughly doubles the cost: DekaLLM billed the 120B at ~$0.0000384/request against
  # DeepInfra's ~$0.000202, because of how reasoning tokens are accounted (~7 visible completion
  # tokens per request vs ~848). Budget ~$28 rather than ~$15.
  # SUPERSEDED 2026-08-12, by explicit decision, after DeepInfra rate-limited gpt-oss-120b upstream
  # and A1 stalled at 8% with every worker parked in backoff. The pin above is kept as the record of
  # why bf16 was wanted; the reasoning still stands, it simply lost to availability. The only other
  # bf16 endpoint (AkashML) was offered as a like-for-like substitute and not taken.
  #
  # Routing is therefore unrestricted: OpenRouter picks the endpoint, and gpt-oss-120b is served at
  # fp4, fp8, bf16 and fp16 across twenty of them.
  #
  # WHAT THIS COSTS, stated plainly so it is not rediscovered at review: quantization now varies
  # WITHIN an arm and is not controlled. A model served at fp4 for one mode and bf16 for another
  # produces a difference that this study cannot distinguish from the context effect it is
  # measuring, and the effects here are modest. This is a real confound, not a formality.
  #
  # It is made auditable rather than invisible: every call records the provider that served it
  # (`provider` in the cache record), and `--provider-mix` reports the split per (arm, mode) so the
  # methods can state it and any correlation between provider and score can be checked directly. If
  # the mix turns out lopsided across modes, that check is mandatory before the numbers are used.
  #
  # `sort` is left null on purpose. Setting `price` would drive nearly everything to the cheapest
  # fp4 endpoint, which is the worst case for this confound; default routing balances across
  # endpoints and is also what makes another single-provider throttle unlikely.
  only: []
  allow_fallbacks: true
  sort: null
  # 32 -> 96 -> 48. The raise to 96 did lift throughput to ~94 calls/min, but it also pushed
  # DeepInfra past its upstream limit: after ~50 min the run hit a sustained 429 storm
  # ("temporarily rate-limited upstream") and 199 calls burned through their retries in under two
  # minutes. So the ceiling is NOT purely local concurrency, as the earlier note assumed -- 32 was
  # simply below the threshold where the provider pushes back.
  #
  # 48 is a deliberate compromise: comfortably above the 32 that showed no 429s, well below the 96
  # that provoked them. Paired with the longer jittered backoff in run_openrouter.py, a throttle
  # now costs a pause rather than a batch of dead calls.
  max_workers: 48

# Reasoning configuration, copied from models/openrouter_LLM_*/src/model_cfg.yml.
#
# NOT optional and NOT a default: GPT-OSS are reasoning models, and the benchmark ran them with an
# explicit `reasoning` block. Omitting it here would let the provider apply whatever default it
# likes, so the anchor check (A1 at M2 reproducing the published 0.554) would compare two different
# reasoning budgets and a mismatch would be uninterpretable. It also drives cost: the benchmark's
# gpt-oss-20b spent 3.2M reasoning tokens across 4,000 requests, which is why the 20B costs four
# times the 120B despite being smaller.
#
# effort vs max_tokens is chosen per vendor exactly as predict.py does: Anthropic and Google take
# max_tokens, everything else takes effort, and meta-llama/mistralai get no block at all. Only
# OpenAI models are used here, so `effort` applies -- but the routing is implemented in full so
# adding a model later cannot silently send the wrong field.
reasoning:
  enabled: true
  effort: medium           # "minimal" | "low" | "medium" | "high"
  max_tokens: 10000        # used only for anthropic/google models
  exclude: false           # false = reason, and return the reasoning tokens

# ---------------------------------------------------------------------------
# Arms
# ---------------------------------------------------------------------------
arms:
  A1_llm_percell:
    kind: openrouter
    model: openai/gpt-oss-120b
    granularity: cell
    template: instruction        # the benchmark's own LLM template
  A2_base_percell:
    kind: local
    # RESOLVED AT RUNTIME, not hardcoded: run_local.py reads C2S-Scale's config.json and asserts
    # this id matches its `_name_or_path`. The control is only a control if it shares the
    # fine-tuned model's starting point.
    model: google/gemma-2-2b
    verify_base_of: vandijklab/C2S-Scale-Gemma-2-2B
    granularity: cell
    template: instruction        # same prompt as A1, which is what makes the pair fair
    decoding: greedy             # decoded as A3, so the two differ in their weights only
  A3_scllm_percell:
    kind: local
    model: vandijklab/C2S-Scale-Gemma-2-2B
    granularity: cell
    template: c2s                # C2S-Scale's own template
    # Greedy, as the C2S-Scale authors benchmark ("deterministic generation with a temperature
    # setting of 0", Rizvi et al., bioRxiv 2025.04.14.648850, section 4.5) and as the benchmark's
    # wrapper decodes (models/c2s_scale_2B_unblind/src/predict.py: do_sample=False, 20 new tokens).
    decoding: greedy

  # Second general-purpose LLM, at a smaller scale. Adds a within-family size contrast alongside
  # the base-vs-adapted contrast, and a second point on the cost axis of the per-cell/per-cluster
  # panel. Benchmarked at 0.504 constrained against 0.554 for the 120B, so the pair also shows
  # whether context is worth more or less to a weaker model.
  #
  # Per-CELL only, for the same reason C2S and base Gemma are: the granularity contrast is already
  # isolated by A1 vs A4 holding the model fixed, and a second model per-cluster would widen the
  # grid without sharpening it.
  A5_llm20_percell:
    kind: openrouter
    model: openai/gpt-oss-20b
    granularity: cell
    template: instruction
  # Per-CLUSTER, and deliberately the same model as A1. Holding the model fixed makes granularity
  # the only variable between A1 and A4, which is what the per-cell-vs-per-cluster claim needs.
  #
  # DO NOT add C2S-Scale here to "complete the grid". Its template is explicitly per-cell ("a list
  # of N gene names ordered by descending expression level in a {organism} cell ... the cell type
  # corresponding to these genes is") and it was fine-tuned on cell sentences from individual
  # cells. Cluster marker genes are off-distribution on both counts, so a poor score would measure
  # the mismatch rather than the method. Same reasoning for the base Gemma arm: adding it here
  # would widen the grid without sharpening the granularity contrast, which is already isolated by
  # A1 vs A4.
  A4_llm_percluster:
    kind: openrouter
    model: openai/gpt-oss-120b
    granularity: cluster
    template: marker_genes

  # The per-cluster result on a FRONTIER model. A4 alone cannot tell whether cluster-level
  # annotation is competitive in general or only for a mid-tier model with room to improve;
  # gemini-3.1-pro-preview was the benchmark's strongest LLM (0.622 mean constrained against
  # gpt-oss-120b's 0.554), so it is the case with least headroom and the hardest test.
  #
  # Prompts are COPIED from A4 rather than regenerated, which makes them byte-identical: the
  # marker-gene prompt does not depend on the model, and re-running cluster.py could return
  # different clusters and confound model with clustering.
  #
  # The per-cell counterpart is NOT run here. At this model's price it would be ~$113 against $19
  # for the cluster arm, so the per-cell number is taken from the benchmark's existing
  # `gemini-3.1-pro-preview_unblind` row, which is the same experiment: same eval cells, and our M2
  # prompts were verified byte-identical to the benchmark's construction.
  #
  # CARRY THIS CAVEAT: that ported number is from an earlier run, so model version and routing may
  # have drifted. The drift is measurable rather than hypothetical -- gpt-oss-120b scored 0.554 in
  # the benchmark and 0.518 in our fresh M2 under identical prompts, a gap of 0.036. Treat a
  # per-cluster advantage smaller than that as unproven.
  A8_gemini_percluster:
    kind: openrouter
    model: google/gemini-3.1-pro-preview
    granularity: cluster
    template: marker_genes

  # ---------------------------------------------------------------------------
  # The 27B pair. Added 2026-08-13, after the note that stood here was falsified by measurement.
  #
  # That note set the pair aside because C2S-Scale-27B "does NOT fit the available hardware" and
  # because its only base counterpart looked like the OpenRouter-served `gemma-2-27b-it`. Both
  # premises were wrong once the IMBI H100 node was in use:
  #
  #   * FIT. 27B in bf16 is ~54 GB against 95.8 GB on an H100 NVL, so it runs on ONE GPU with ~42 GB
  #     left for activations. No model parallelism, and still inside the 2-GPU-per-job cap.
  #   * BASE. C2S-Scale-27B's model card declares `base_model: google/gemma-2-27b` -- the BASE
  #     model, not `-it`. Running it locally therefore gives a clean pair and removes the concern
  #     that the comparison measures instruction tuning. Cost also disappears: local GPU, not API.
  #
  # WHY IT IS WORTH THE ~7 HOURS. The 2B pair alone can only say what adaptation bought at small
  # scale, and C2S-Scale's own paper argues its capabilities emerge with size. One pair is a data
  # point that a reviewer can dismiss as "you only tested a small model"; two pairs at 2B and 27B
  # are a trend, and they answer whether the base-model control's verdict survives scaling.
  #
  # OPERATIONAL NOTES, all measured rather than assumed:
  #   * gemma-2-27b ships FP32 weights (101 GB download, 24 shards) and converts to bf16 on load;
  #     C2S-Scale-27B ships bf16 (51 GB). Budget ~152 GB in /scratch/global, which has 22 TB.
  #   * `low_cpu_mem_usage=True` in run_local.load_model is MANDATORY here, not an optimisation. A
  #     job gets 62 GB of CPU RAM (DefMemPerGPU=62000) and the plain load path materialises the
  #     whole 101 GB checkpoint in RAM before moving it to the GPU. Without it the job is OOM-killed
  #     on startup, which surfaces as the "Kill task failed" the IMBI docs warn about.
  #   * Batch 32, not the 128 used at 2B. Activations cost ~3.5x per sequence (hidden 2304->4608,
  #     layers 26->46); batch 128 projects to ~113 GB and overflows the card, batch 32 to ~69 GB.
  #     Submit with BATCH=32 and read the VRAM line before raising it.
  # ---------------------------------------------------------------------------
  # DEFERRED 2026-08-13 after an attempted run. The arms below are correct and ready -- prompts are
  # materialised (84 files each, byte-identical to their 2B counterparts), the control check passes
  # (`base_model: google/gemma-2-27b`), batch size is calibrated. What blocks them is model loading
  # on this cluster, and the evidence is worth keeping because it rules things out:
  #
  #   * It is NOT a fit problem. 27B in bf16 occupies 52,461 MiB of a 95,830 MiB H100 NVL, measured.
  #   * It is NOT the `.to(device)` copy. Switching to `device_map={"": 0}` moved the weights onto
  #     the card in ~1 min instead of stalling at 24.8 GB for over an hour -- a real improvement.
  #   * It is NOT our diagnostics. A `sum(p.numel() ...)` line was suspected and removed; the stall
  #     survived it.
  #   * It IS inside `from_pretrained`, AFTER the weights are fully resident. Instrumented timing:
  #     tokenizer at +3.9 s, then `from_pretrained` never returns, while nvidia-smi shows the full
  #     model on the GPU at 0% utilisation. Stack: transformers 4.57.6, accelerate 1.14.0,
  #     torch 2.13.0+cu130.
  #
  # Two things to try if this is picked up again, in order of expected value:
  #   1. Pin a transformers version known good for Gemma-2-27B. The 2B pair runs fine on this stack,
  #      so the interaction is size- or architecture-specific rather than general.
  #   2. Ask IMBI to free /scratch/local (measured 100% full, 3.4 GB) so the weights can be staged on
  #      local NVMe instead of NFS. That removes the I/O variable entirely rather than working
  #      around it.
  #
  # Nothing else depends on these arms: the 2B pair already supplies the base-vs-adapted control,
  # and A4/A5 run on OpenRouter without a GPU.
  A6_base27_percell:
    kind: local
    model: google/gemma-2-27b
    # Carried here rather than passed at submit time, so the value cannot be forgotten by whoever
    # submits. 128 (the 2B default) projects to ~113 GB on a 95.8 GB card; 32 lands near 69 GB.
    batch_size: 32
    verify_base_of: vandijklab/C2S-Scale-Gemma-2-27B
    granularity: cell
    template: instruction        # same prompt as A1/A2, which is what makes the pair fair
    decoding: greedy             # as the 2B pair
  A7_scllm27_percell:
    kind: local
    model: vandijklab/C2S-Scale-Gemma-2-27B
    batch_size: 32
    granularity: cell
    template: c2s                # C2S-Scale's own template, as for A3
    decoding: greedy             # as A3

# ---------------------------------------------------------------------------
# Context modes
#
# NOTE the per-arm asymmetry, verified in code: the C2S template already injects {organism}, while
# the OpenRouter template exposes only {num_genes}/{cell_sentence}/{unique_cell_types}. So for the
# `c2s` template M3/M4 add ONLY tissue. Do not describe the modes as identical across arms.
# ---------------------------------------------------------------------------
modes:
  M1: {cell_types: false, tissue_species: false, genes: true}
  M2: {cell_types: true,  tissue_species: false, genes: true}
  M3: {cell_types: false, tissue_species: true,  genes: true}
  M4: {cell_types: true,  tissue_species: true,  genes: true}

  # M1 with the gene ORDER destroyed: identical genes, identical count, identical prompt text, only
  # the descending-expression ranking permuted. Sits between chance and M1 on the information
  # ladder, so M1 - M6 is exactly what the ranking is worth.
  #
  # This is the control M5 could not be. Nothing about the setup forces an outcome: the prompt is
  # well-formed, the evidence is real and cell-specific, and the model has every opportunity to
  # score as well as it does on M1. If it does, the cell sentence is functioning as an unordered
  # marker set -- a claim about the REPRESENTATION that C2S-Scale and the benchmark both rest on,
  # not merely about our prompt.
  #
  # No context deliberately: the candidate list would give the model a second route to the answer
  # and blunt the contrast. Comparing against M1 keeps one variable in play.
  M6: {cell_types: false, tissue_species: false, genes: true, shuffle_genes: true}

  # PER-CELL ARMS ONLY, by decision. The cluster prompt has a shuffleable order too -- its 25 marker
  # genes are ranked by how strongly they distinguish the cluster, and the prompt says so -- but the
  # question is already answered where it matters. On the per-cell arms, shuffling changes 59% of
  # C2S-Scale's predictions and halves its accuracy on human_pancreas, so the ranking demonstrably
  # carries signal. A cluster-side replication would test something narrower (does DEG ordering
  # matter in a marker-gene prompt) and supports no R5 claim on its own.

  # M5 (context, no gene input) WAS here and was removed on 2026-08-13, with its prompts,
  # predictions and scored runs. Recorded so it is not reinvented:
  #
  #   * It sat off the information ladder the other modes form. M5 carried MORE context than M1 but
  #     no transcriptome, so it was not a step in any ordering of "how much is supplied" -- which is
  #     why it looked wrong at either end of the x axis.
  #   * Under balanced accuracy it could barely fail. Nothing varies per cell except the shuffled
  #     candidate order, so the model returns a near-constant answer and scores 1/N_classes by
  #     arithmetic rather than by measurement. A control that cannot come out badly is not evidence.
  #   * It duplicated a baseline the benchmark already has. `random_stratified` lands within 0.001
  #     of 1/N on all four datasets and is the established dashed-red reference in the figures.
  #   * Its `n_calls: 200` was justified by a claim that turned out to be false -- that "every
  #     prompt within a dataset is identical". The candidate list is shuffled PER CELL, so all
  #     1,000 differed. The subset was also taken as the FIRST 200 rows of a class-ordered h5ad, so
  #     it covered 1-3 classes instead of 9-38 and every M5 number was scored against the wrong
  #     denominator.
  #
  # The question M5 was meant to answer -- is the score coming from the transcriptome or from the
  # candidate list narrowing the space? -- is better answered by permuting the gene sentence while
  # keeping the prompt structure intact, since that control CAN fail.

# ---------------------------------------------------------------------------
# Gene-list ablation
# ---------------------------------------------------------------------------
genes:
  cap: 200                       # unchanged from the benchmark, in both variants
  variants:
    expression_ranked: {hvg: false}     # the benchmark's own construction
    hvg: {hvg: true}
  # Run the HVG variant only in the extreme modes: this still answers "does gene selection matter,
  # and does it interact with context" at half the compute. Set to null to run every mode.
  hvg_modes: [M1, M4]

hvg:
  # SETTLED: flavor="seurat" on the context h5ads. seurat_v3_paper needs raw counts and the
  # contexts carry only log1p X (no layers, no raw) -- verified. The full preprocessed data would
  # give counts but cache/datasets/preprocessed is empty under the Zenodo fast-path, and the
  # _random subsets are not on the Zenodo record.
  source_dir: ../../cache/datasets/context
  flavor: seurat
  # Pool size; each cell still takes its top `genes.cap` by expression from within the pool.
  #
  # MEASURED on the built sentences (results/sentence_stats.csv), not estimated. Share of cells
  # whose sentence falls SHORT of the 200-gene cap, which would confound gene choice with sentence
  # length:
  #   HFRA 30.4%   Zeisel 8.6%   HIHA 5.3%   human_pancreas 3.2%
  #
  # A pre-run approximation off the raw subset matrices put these at 49 / 22 / 27 / 2 percent. The
  # real construction is milder because cell2sentence ranks every detected gene before truncating.
  # Only HFRA is materially affected; the caveat travels with that dataset rather than all four.
  #
  # 5000 is a deliberate middle ground: aggressive enough to reselect rather than merely drop
  # uninformative genes. sentences.py RECORDS realized sentence length per cell, and aggregate.py
  # joins it to every row, so the confound is visible in the results table rather than invisible.
  n_top_genes: 5000
  use_batch_key: true            # per-dataset batch key is read from ../../datasets/<ds>.yml
  # Dropped BEFORE selection, using the same prefixes preprocessing already annotates.
  exclude_prefixes: [RPS, RPL, MT-, HB]
  out_dir: ../../cache/hvg

cluster:
  # A4 clusters the same context object scType and SCSA already use, so the cluster-level LLM is
  # methodologically identical to them except for how a cluster gets its label.
  source_dir: ../../cache/datasets/context
  algorithm: leiden
  resolutions: [0.5, 1.0]        # two, because resolution sensitivity IS the granularity claim
  n_marker_genes: 25
  rank_method: wilcoxon

scoring:
  # Reuse the benchmark's own two stages so the numbers are on one scale.
  map_predictions: ../../bin/map_predictions.py
  evaluate: ../../bin/evaluate.py
  # LOCAL, not ../cache. map_predictions.py appends every newly seen label to
  # cell_type_ontology_mappings.csv inside cache_dir, so pointing it at the shared cache made this
  # study WRITE INTO THE BENCHMARK'S mapping file -- 459 rows on the first partial run, including
  # entries like `a2m` and `a5galt-dt`, which are gene symbols C2S-Scale emitted instead of a cell
  # type. Those would have sat in the file the published numbers depend on.
  #
  # Seeded from the committed benchmark CSV (1,873 reviewed mappings) so canonicalisation is
  # identical and the scales stay comparable; new discoveries now accumulate here instead. The
  # benchmark's pinned Cell Ontology release (cl-basic_<release>.obo) is copied alongside it, so
  # the ontology is not re-downloaded and both studies use the same version.
  cache_dir: ./cache
  min_scoring_coverage: 0.9

# ---------------------------------------------------------------------------
# Execution split
#
# The OpenRouter arms need no GPU, no model weights and no torch; the local arms need all three.
# The laptop (M2 Max, 96 GB, arm64) has ample memory but only ~18 GB free disk, against ~17-19 GB
# for a torch env plus both 2B checkpoints -- too tight. So the work splits by stack, not by taste:
#
#   laptop   A1, A4, A5   (OpenRouter)  + prompt materialisation + clustering + scoring
#   cluster  A2, A3       (local weights)
#
# PROMPTS ARE MATERIALISED ONCE, on the laptop, and both runners consume the same files. This is
# the important part of the split: `cell2sentence` DEFINES the sentence construction, so if the two
# machines resolved different versions the arms would silently read different inputs and stop being
# comparable. Building prompts in one place makes that impossible rather than merely unlikely, and
# it means the cluster job needs neither cell2sentence, nor scanpy, nor the 1 GB context h5ads.
# ---------------------------------------------------------------------------
execution:
  # Which arms run where. Runners refuse arms not listed for their host, so a half-configured
  # machine fails loudly instead of silently skipping an arm.
  hosts:
    laptop:  [A1_llm_percell, A4_llm_percluster, A5_llm20_percell]
    # The 27B pair is listed but NOT run by the bare `--host cluster` default in practice: submit it
    # explicitly per arm through slurm/submit_shards.sh, because it needs BATCH=32 and a longer
    # walltime than the 2B pair. Running all four local arms in one sweep at the 2B settings would
    # overflow the card on the 27B shards.
    cluster: [A2_base_percell, A3_scllm_percell, A6_base27_percell, A7_scllm27_percell]

output:
  aggregate_csv: results/context_ablation.csv

# ---------------------------------------------------------------------------
# Study trees
#
# Each study keeps prompts/, predictions/, cache/ and scored/ in its own folder, chosen with
# --study (default: ablation). The candidate-list study needs a tree of its own for three reasons:
# the response cache is keyed on (model, prompt, seed), so its exact-list prompts, which equal M2's,
# would be served the stored M2 answers instead of being asked again; score.py scores every
# prediction under its tree, and aggregate.py feeds the figures and tables from it; and
# prune_cache.py would delete the list study's answers as orphans.
# ---------------------------------------------------------------------------
studies:
  ablation: results
  lists: results_lists

# ---------------------------------------------------------------------------
# Imperfect candidate lists
#
# Every condition is mode M2 (the list, no tissue or species, expression-ranked genes) with another
# list. src/lists.py draws the lists per dataset and seed into results_lists/lists/. relatives: the
# share of true types that get their parent or a child added; extra: absent types added; remove:
# the share of true types removed, at least one; uncertain: the prompt offers "uncertain"
# (prompts.UNCERTAIN_RULE).
# ---------------------------------------------------------------------------
lists:
  mode: M2
  resolution: 1.0                # the cluster arm's resolution, as in the figures
  arms: [A1_llm_percell, A3_scllm_percell, A8_gemini_percluster]
  conditions:
    E: {}
    EU: {uncertain: true}
    L1: {relatives: 0.5}
    L2-2: {extra: 2}
    L2-5: {extra: 5}
    L3: {remove: 0.25, uncertain: true}
    L4: {relatives: 0.5, extra: 5, remove: 0.25, uncertain: true}
