# Design of the prompt-context ablation (study tree results/) and of the imperfect-list analysis
# (study tree results_lists/). Relative paths are relative to paper/experiments/.

datasets: [HFRA, HIHA, Zeisel, human_pancreas]

# The 1,000-cell stratified test sets of the benchmark.
eval:
  subset_dir: ../../cache/datasets/subset
  size: 1000
  strategy: stratified

# Repeats. The seed is sent with every OpenRouter request and draws the order of the candidate
# lists and, in M6, of the genes.
repeats:
  n: 3
  seeds: [1234, 5678, 9012]
  temperature: null        # null: the provider's default

# Provider routing of the OpenRouter requests. With an empty `only`, OpenRouter chooses the
# provider; the cache records the provider of each call (run_openrouter.py --provider-mix).
provider:
  only: []
  allow_fallbacks: true
  sort: null               # null: OpenRouter's default routing
  max_workers: 48          # concurrent requests

# The reasoning field of the OpenRouter requests, as in the benchmark's OpenRouter wrapper.
reasoning:
  enabled: true
  effort: medium           # "minimal" | "low" | "medium" | "high"
  max_tokens: 10000        # used only for anthropic/google models
  exclude: false           # false: the response includes the reasoning

# Arms: an OpenRouter or a local model, prompts per cell or per cluster, and a prompt template
# (prompts.py). verify_base_of names the fine-tuned model whose base model run_local.py checks
# against `model`.
arms:
  A1_llm_percell:
    kind: openrouter
    model: openai/gpt-oss-120b
    granularity: cell
    template: instruction        # the benchmark's own LLM template
  A2_base_percell:
    kind: local
    model: google/gemma-2-2b
    verify_base_of: vandijklab/C2S-Scale-Gemma-2-2B
    granularity: cell
    template: instruction        # the prompt of A1
    decoding: greedy             # as A3, so that A2 and A3 differ in their weights only
  A3_scllm_percell:
    kind: local
    model: vandijklab/C2S-Scale-Gemma-2-2B
    granularity: cell
    template: c2s                # C2S-Scale's own template
    decoding: greedy             # as the benchmark's C2S-Scale wrapper (do_sample=False)

  A5_llm20_percell:
    kind: openrouter
    model: openai/gpt-oss-20b
    granularity: cell
    template: instruction
  # The model of A1, with one prompt per cluster.
  A4_llm_percluster:
    kind: openrouter
    model: openai/gpt-oss-120b
    granularity: cluster
    template: marker_genes

  # In the ablation tree, the prompt files of this arm are those of A4, copied under its name.
  A8_gemini_percluster:
    kind: openrouter
    model: google/gemini-3.1-pro-preview
    granularity: cluster
    template: marker_genes

  # The base model and C2S-Scale at 27B.
  A6_base27_percell:
    kind: local
    model: google/gemma-2-27b
    # Generation batch size, read by slurm/submit_shards.sh (128 when not set).
    batch_size: 32
    verify_base_of: vandijklab/C2S-Scale-Gemma-2-27B
    granularity: cell
    template: instruction        # the prompt of A1 and A2
    decoding: greedy             # as the 2B pair
  A7_scllm27_percell:
    kind: local
    model: vandijklab/C2S-Scale-Gemma-2-27B
    batch_size: 32
    granularity: cell
    template: c2s                # C2S-Scale's own template, as for A3
    decoding: greedy             # as A3

# Context modes: whether a prompt lists the candidate cell types, names tissue and species, and
# holds the genes. The c2s template names the organism already, so there M3 and M4 add only the
# tissue. M6 is M1 with the genes in a random order.
modes:
  M1: {cell_types: false, tissue_species: false, genes: true}
  M2: {cell_types: true,  tissue_species: false, genes: true}
  M3: {cell_types: false, tissue_species: true,  genes: true}
  M4: {cell_types: true,  tissue_species: true,  genes: true}
  M6: {cell_types: false, tissue_species: false, genes: true, shuffle_genes: true}

# Gene variants of the cell sentences.
genes:
  cap: 200                       # genes per cell sentence, as in the benchmark
  variants:
    expression_ranked: {hvg: false}     # the benchmark's own construction
    hvg: {hvg: true}
  # Modes with the hvg variant; null for every mode.
  hvg_modes: [M1, M4]

# The HVG pool of the hvg variant (hvg.py), selected on each clustering context. flavor seurat,
# since the contexts hold log-normalised expression without counts.
hvg:
  source_dir: ../../cache/datasets/context
  flavor: seurat
  # Pool size; each cell still takes its top `genes.cap` by expression from within the pool.
  n_top_genes: 5000
  use_batch_key: true            # per-dataset batch key is read from ../../datasets/<ds>.yml
  # Symbol prefixes of the genes dropped before selection.
  exclude_prefixes: [RPS, RPL, MT-, HB]
  out_dir: ../../cache/hvg

# Clustering of the cluster arms (cluster.py), on the clustering context that scType and SCSA use.
cluster:
  source_dir: ../../cache/datasets/context
  algorithm: leiden
  resolutions: [0.5, 1.0]
  n_marker_genes: 25
  rank_method: wilcoxon

# Scoring with the benchmark's scripts (score.py). cache_dir holds the study's own copy of the
# mapping table (resources/cell_type_ontology_mappings.csv), to which new answers are added, and
# the pinned Cell Ontology release.
scoring:
  map_predictions: ../../bin/map_predictions.py
  evaluate: ../../bin/evaluate.py
  cache_dir: ./cache
  # A run gets no metrics if a smaller share of its answers are CL terms or reviewed mappings.
  min_scoring_coverage: 0.9

# The arms that run_openrouter.py and run_local.py run without --arms, chosen with --host.
execution:
  hosts:
    laptop:  [A1_llm_percell, A4_llm_percluster, A5_llm20_percell]
    cluster: [A2_base_percell, A3_scllm_percell, A6_base27_percell, A7_scllm27_percell]

output:
  aggregate_csv: results/context_ablation.csv    # written by aggregate.py

# Study trees, chosen with --study. Each holds its own prompts/, predictions/, cache/ and scored/,
# so the list condition E, whose prompts equal those of M2, is asked again, and each study scores
# only its own runs.
studies:
  ablation: results
  lists: results_lists

# Imperfect candidate lists (lists.py). Every condition is mode M2 with another list, drawn per
# dataset and seed into results_lists/lists/. relatives: the share of true types that get their
# parent or a child added; extra: absent types added; remove: the share of true types removed, at
# least one; uncertain: the prompt offers "uncertain" (prompts.UNCERTAIN_RULE).
lists:
  mode: M2
  resolution: 1.0                # clustering resolution of the cluster arm
  arms: [A1_llm_percell, A3_scllm_percell, A8_gemini_percluster]
  conditions:
    E: {}
    EU: {uncertain: true}
    L1: {relatives: 0.5}
    L2-2: {extra: 2}
    L2-5: {extra: 5}
    L3: {remove: 0.25, uncertain: true}
    L4: {relatives: 0.5, extra: 5, remove: 0.25, uncertain: true}
