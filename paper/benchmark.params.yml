# The benchmark of the paper. Run from the repository folder:
#   nextflow run main.nf -profile local -params-file paper/benchmark.params.yml
# All predictions are in paper/predictions, so no method runs: the pipeline maps and scores the
# stored answers and writes the tables of paper/results to results_paper/.
datasets: [HFRA, HIHA, Zeisel, human_pancreas]
models:
  - openrouter_LLM_unconstrained
  - openrouter_LLM_constrained
  - c2s_scale_2B_unconstrained
  - c2s_scale_2B_constrained
  - c2s_scale_27B_unconstrained
  - c2s_scale_27B_constrained
  - cellwhisperer_unconstrained
  - cellwhisperer_constrained
  - instructcell_unconstrained
  - instructcell_constrained
  - langcell_unconstrained
  - langcell_constrained
  - mmcontext_unconstrained
  - mmcontext_constrained
  - celltypist_unconstrained
  - celltypist_constrained
  - scsa_unconstrained
  - scsa_constrained
  - sctype_unconstrained
  - sctype_constrained
  - singler_unconstrained
  - singler_constrained
  - random_stratified
subset_sizes: [1000, 10000]
predictions_dir: paper/predictions
use_text_encoder: true
outdir: results_paper
